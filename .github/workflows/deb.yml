name: Build Debian packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEBIAN_IMAGE: debian:trixie-slim

jobs:
  validate:
    name: Validate workflow and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check workflow and packaging scripts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck desktop-file-utils
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/deb.yml
          bash -n packaging/build-deb.sh
          shellcheck packaging/build-deb.sh
          desktop-file-validate packaging/memonitor.desktop

  build:
    name: deb (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            testing: "ON"
            qemu: ""
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            testing: "ON"
            qemu: ""
          - arch: armhf
            platform: linux/arm/v7
            runner: ubuntu-24.04
            testing: "OFF"
            qemu: arm
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04
            testing: "OFF"
            qemu: riscv64
    env:
      BUILD_TESTING: ${{ matrix.testing }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Enable QEMU
        if: ${{ matrix.qemu != '' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: ${{ matrix.qemu }}

      - name: Build and package
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            --volume "${GITHUB_WORKSPACE}:/work" --workdir /work \
            --env DEBIAN_FRONTEND=noninteractive \
            --env BUILD_TESTING --env RELEASE_TAG \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            "$DEBIAN_IMAGE" bash -euo pipefail -c '
              apt-get update
              apt-get install --yes --no-install-recommends \
                build-essential cmake ninja-build pkg-config qt6-base-dev \
                dpkg-dev file dbus-daemon desktop-file-utils
              desktop-file-validate packaging/memonitor.desktop
              bash packaging/build-deb.sh
            '

      - name: Verify installation in a clean container
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            --volume "${GITHUB_WORKSPACE}/dist:/packages:ro" \
            --env DEBIAN_FRONTEND=noninteractive \
            "$DEBIAN_IMAGE" bash -euo pipefail -c '
              apt-get update
              apt-get install --yes --no-install-recommends /packages/*.deb
              timeout 30s memonitor --dump
              status=0
              QT_QPA_PLATFORM=offscreen timeout 5s memonitor || status=$?
              test "$status" -eq 124
            '

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deb-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release packages
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Check packages and write checksums
        shell: bash
        working-directory: dist
        run: |
          for architecture in amd64 arm64 armhf riscv64; do
            packages=(memonitor_*_"${architecture}".deb)
            test "${#packages[@]}" -eq 1
            test -f "${packages[0]}"
            test "$(dpkg-deb --field "${packages[0]}" Architecture)" = "$architecture"
            sha256sum --check "${packages[0]}.sha256"
          done
          sha256sum ./*.deb > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MemMonitor ${RELEASE_TAG}" --generate-notes
          fi
